# Canonical host consolidation (SEO-1). Traefik routes BOTH apex and www to
# this container (see deploy/recreate-from-image.sh's router labels), so www
# arrives here with its Host intact and the 301 can live entirely in nginx —
# no label changes. nginx prefers an exact server_name over the default `_`
# below, so ONLY www traffic enters this block; every non-www request
# (/games/, /s/d/, /healthz, PWA control files, assets) is untouched.
#
# The redirect is unconditional and carries $request_uri, which is the raw
# path + query string — so deep links and campaign params survive the hop.
# TLS terminates at Traefik, hence the hardcoded https:// scheme: $scheme
# would resolve to the http of the internal hop and cause a redirect loop.
server {
  listen 80;
  server_name www.verveq.com;
  return 301 https://verveq.com$request_uri;
}

server {
  # `default_server` is load-bearing, not decoration: `server_name _` is a
  # dummy name that matches nothing on its own, so a Host nginx can't match
  # falls through to whichever block is the DEFAULT — which, without this,
  # is simply the first one in the file. Adding the www block above therefore
  # silently turned the 301 into the catch-all and redirected every apex
  # request too. Marking this block default_server pins the fallback here
  # regardless of block order.
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback. The HTML shell must NOT be cached (deploys swap it for new
  # hashed asset URLs); hashed assets below get the long-cache half of the
  # split. `no-cache` still allows conditional revalidation via ETag.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-cache';
  }

  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Legal pages are static documents, but their public URLs intentionally have
  # no trailing slash (they are the sitemap and footer URLs). An ordinary
  # `try_files $uri $uri/` lookup would emit nginx's directory-slash redirect,
  # which is especially harmful here because TLS terminates at Traefik and the
  # internal redirect can advertise an `http://` Location. Serve the concrete
  # files directly at the canonical no-slash URLs.
  location = /privacy {
    try_files /privacy/index.html =404;
    add_header Cache-Control 'no-cache';
  }

  location = /terms {
    try_files /terms/index.html =404;
    add_header Cache-Control 'no-cache';
  }

  # Duel share vanity route: verveq.com/s/d/:linkCode (+ /card.png) proxies
  # straight through to the Convex .site httpAction, which serves the OG
  # taunt card to link-preview crawlers and 302s humans to /duel/:linkCode.
  # ^~ so /s/d/.../card.png never falls into the static-asset regex below.
  # The original path and User-Agent must reach Convex intact — crawler
  # detection runs on the UA. The upstream hostname is resolved per-request
  # (variable + resolver) because Convex sits behind a cloud LB whose IPs
  # rotate; a reload-time-resolved upstream would eventually go stale.
  location ^~ /s/d/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $convex_site different-lynx-153.convex.site;
    proxy_pass https://$convex_site;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $convex_site;
    proxy_set_header Host $convex_site;
    proxy_set_header User-Agent $http_user_agent;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # Crawler files are real static files — serve them as-is (they carry no
  # matching extension below, so without these blocks they would fall through
  # to the SPA fallback and soft-404 as the app shell).
  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=3600';
  }

  location = /sitemap.xml {
    try_files $uri =404;
    # `add_header` APPENDS, so the `text/xml` from nginx's default mime map for
    # .xml was still sent alongside this one and clients took the first —
    # the override never actually applied. Emptying the map and setting
    # default_type replaces it instead. (Same treatment as the manifest below.)
    types { }
    default_type application/xml;
    add_header Cache-Control 'public, max-age=3600';
  }

  # PWA control files. Both are unhashed and both are how a client learns a
  # new release exists, so neither may be cached — sw.js in particular would
  # otherwise be caught by the immutable-asset regex below (it matches `.js`)
  # and pin every installed client to the release it first saw for 30 days.
  # Exact-match `=` locations outrank regex locations in nginx, so these win
  # without reordering anything.
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control 'no-cache';
  }

  # Workbox writes its precache manifest to a sibling file when the entry list
  # is large enough to split; it is versioned by content but still referenced
  # by sw.js, so it follows the same rule.
  location ~* ^/workbox-[^/]+\.js$ {
    try_files $uri =404;
    add_header Cache-Control 'no-cache';
  }

  # `.webmanifest` is absent from nginx's default mime.types, so without a type
  # here the manifest is served as application/octet-stream and Chrome refuses
  # to parse it — no install prompt. Set via an emptied `types` map plus
  # `default_type`, NOT `add_header`: add_header APPENDS, so the octet-stream
  # from the default map would still be sent as a second Content-Type and
  # browsers take the first.
  location = /manifest.webmanifest {
    try_files $uri =404;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control 'no-cache';
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control 'public, immutable';
  }

  # Source maps are uploaded to Sentry at build time and deleted before the
  # image is assembled — they must never be served. Hard 404 (instead of the
  # SPA fallback's soft-200) so a .map probe can't read the app shell either.
  location ~* \.map$ {
    return 404;
  }
}
