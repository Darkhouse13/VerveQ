name: deploy

# Auto-deploy after master passes Check:
#   Frontend — SSH to the host; a forced command runs the existing
#   image-based publish (deploy/build-and-run.sh) with rollback kept.
# The Convex backend is deployed manually (Ticket 0.1 C4 removed it from CI).
# VerveQ is NOT a Coolify app; this replaces the manual deploy in docs/DEPLOYMENT.md.
#
# This used to trigger on `push: branches: [master]`, which meant deploy and
# Check started at the same instant and never spoke: the gate ran, but it did
# not gate. A red test could land after players already had the code. Hanging
# the deploy off Check's completion — and refusing anything but success — makes
# the suite that already exists actually block a release.
#
# workflow_dispatch stays as the deliberate override for a manual redeploy or
# rollback, where waiting on CI is not what you want.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [master]
  workflow_dispatch:
  # Daily rebuild of the static SEO layer (app/seo/build.mjs): each night the
  # just-closed daily quiz becomes a /football-quiz/<date>/ page and the
  # sitemap's lastmod moves. Same code as master's last green Check — only the
  # archive data (read from prod Convex at build time) is new. 00:20 UTC gives
  # the midnight-UTC reset a margin.
  schedule:
    - cron: "20 0 * * *"

# One production deploy at a time; let an in-flight one finish rather than
# cancelling it mid-build.
concurrency:
  group: verveq-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome, so the guard is
    # what actually enforces the gate — without it this is the old behaviour
    # with extra steps. A manual dispatch has no parent run and must still pass.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --- Frontend: SSH triggers the server-side forced deploy command ---
      - name: Deploy frontend over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server pins this key to a forced command (verveq-ci-deploy.sh),
          # so the literal "deploy" arg below is ignored — it just triggers the
          # pull + image build + container recreate, streaming logs back here.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "root@${SSH_HOST}" deploy

      # Announce the static SEO layer's URLs to IndexNow (Bing, Yandex, Seznam,
      # Naver) so new pages — e.g. each night's closed quiz — are crawled
      # without waiting for discovery. The key is public by design (served at
      # /<key>.txt). Best-effort: a ping failure never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 20
          curl -fsS https://verveq.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          test "$(wc -l < urls.txt)" -gt 100
          python3 - <<'PY'
          import json, urllib.request
          urls = [l.strip() for l in open("urls.txt") if l.strip()]
          body = {"host": "verveq.com", "key": "14993c89de760998a4e887180efc0e53",
                  "keyLocation": "https://verveq.com/14993c89de760998a4e887180efc0e53.txt", "urlList": urls}
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=json.dumps(body).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          print(urllib.request.urlopen(req).status, len(urls))
          PY
