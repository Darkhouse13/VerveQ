name: perf-budget

# Weekly lab measurement of the reel-traffic entry routes on production
# (VerveQ ONE plan, P5.3): time to first game content, LCP and CLS on a
# throttled phone profile. Fails — and so notifies — when a budget is missed.
# Read-only: no secrets, no deploy. Each run opens a few guest sessions on
# prod (the games need one); analytics hosts are blocked.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure entry routes against the budget
        run: node scripts/perfBudget.mjs https://verveq.com --runs 3
