<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) resolve on notched
         iPhones — without it the bottom nav's safe-area padding is 0 and its
         tap targets sit inside the home-indicator gesture zone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The brand mark (scripts/generatePwaIcons.mjs). `?v=` because nginx
         serves these immutable for 30 days: bump it with ICON_VERSION in
         vite.config.ts whenever the icons are regenerated. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <!-- iOS reads this, never the manifest's icon list, and applies its own
         corner mask to whatever it gets — so the artwork is ink to every edge
         with no alpha channel at all; the mask itself becomes the mark's
         square around the lime VQ. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- Home-screen launches run without Safari chrome. black-translucent puts
         the app behind the status bar, which the viewport-fit=cover +
         safe-area padding above already accounts for. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VerveQ" />
    <!-- Matches the manifest's theme_color (near-black brand ink #121212). -->
    <meta name="theme-color" content="#121212" />
    <!-- Self-hosted brand fonts (@font-face in src/index.css). Only the
         Latin Space Grotesk file is preloaded: it carries the first screen.
         JetBrains Mono and the Latin Extended files load when used. -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--seo:head:start-->
    <title>Football Trivia & Quiz Games — Play Free | VerveQ</title>
    <meta name="description" content="Free football quiz games: a daily quiz, guess the footballer by career path, a football grid, higher or lower and 1v1 duels. No sign-up needed.">
    <meta name="author" content="VerveQ" />
    <link rel="canonical" href="https://verveq.com/" />
    <meta property="og:site_name" content="VerveQ" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://verveq.com/" />
    <meta property="og:title" content="VerveQ — daily football games. Can you beat it?">
    <meta property="og:description" content="Who's Older, Missing Letters, Career Path and more. Free, no sign-up.">
    <meta property="og:image" content="https://verveq.com/og/v2/home.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VerveQ — daily football games. Can you beat it?">
    <meta name="twitter:description" content="Who's Older, Missing Letters, Career Path and more. Free, no sign-up.">
    <meta name="twitter:image" content="https://verveq.com/og/v2/home.png" />
    <!--seo:head:end-->
    <!-- Google Analytics loads after first paint: src/lib/ga4.ts -->
    <!--
      Ink first paint: every app route runs on the ink ground (VerveQ ONE
      decision 1), so the page and a skeleton paint ink until React renders
      into #root (main.tsx then drops the class). The static SEO pages are the
      one exception: they are cream documents whose content sits after #root,
      so the skeleton must not cover them.
    -->
    <script>
      if (!/^\/(games|football-quiz|who-played-for|career-path-quiz|fr|es|about)(\/|$)/.test(location.pathname)) {
        document.documentElement.className += " boot-ink";
      }
    </script>
    <style>
      html.boot-ink, html.boot-ink body { background: #121212; }
      html.boot-ink #root:empty { position: fixed; inset: 0; padding: 72px 20px 0; }
      html.boot-ink #root:empty::before,
      html.boot-ink #root:empty::after {
        content: ""; display: block; height: 36vh; max-height: 300px; margin: 0 auto 16px;
        max-width: 420px; border-radius: 8px; border: 2px solid rgba(255, 247, 240, 0.12);
        background: #1f1f1f; animation: boot-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes boot-pulse { from { opacity: 0.55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        html.boot-ink #root:empty::before, html.boot-ink #root:empty::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!--seo:body-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
